naftiko: 1.0.0-alpha2
info:
  label: Tyson Foods EDI Integration API — Shipments
  description: 'Tyson Foods EDI Integration API — Shipments. 1 operations. Lead operation: Get Shipments. Self-contained Naftiko
    capability covering one Tyson Foods business surface.'
  tags:
  - Tyson Foods
  - Shipments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TYSON_FOODS_API_KEY: TYSON_FOODS_API_KEY
capability:
  consumes:
  - type: http
    namespace: edi-integration-shipments
    baseUri: https://api.tysonfoods.com
    description: Tyson Foods EDI Integration API — Shipments business capability. Self-contained, no shared references.
    resources:
    - name: shipments
      path: /shipments
      operations:
      - name: getshipments
        method: GET
        description: Get Shipments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: edi-integration-shipments-rest
    port: 8080
    description: REST adapter for Tyson Foods EDI Integration API — Shipments. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/shipments
      name: shipments
      description: REST surface for shipments.
      operations:
      - method: GET
        name: getshipments
        description: Get Shipments
        call: edi-integration-shipments.getshipments
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: edi-integration-shipments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tyson Foods EDI Integration API — Shipments. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-shipments
      description: Get Shipments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: edi-integration-shipments.getshipments
      outputParameters:
      - type: object
        mapping: $.
