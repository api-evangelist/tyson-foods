naftiko: "1.0.0-alpha1"

info:
  label: "Tyson Foods EDI Integration API"
  description: >-
    Tyson Foods B2B EDI integration API for trading partners to manage
    purchase orders and shipment tracking.
  tags:
    - Tyson Foods
    - EDI
    - Supply Chain
    - Order Management
    - Logistics
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TYSON_FOODS_ACCESS_TOKEN: TYSON_FOODS_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: tyson-edi
      baseUri: https://api.tysonfoods.com
      description: "Tyson Foods EDI Integration REST API"
      authentication:
        type: bearer
        token: "{{TYSON_FOODS_ACCESS_TOKEN}}"
      resources:
        - name: orders
          path: /orders
          description: "Purchase order management"
          operations:
            - name: get-orders
              method: GET
              description: "Retrieve a list of orders for a trading partner"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: order
          path: /orders/{orderId}
          description: "Single order operations"
          operations:
            - name: get-order-by-id
              method: GET
              description: "Retrieve a specific order by ID"
              inputParameters:
                - name: orderId
                  in: path
                  type: string
                  required: true
                  description: "Purchase order identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: shipments
          path: /shipments
          description: "Shipment tracking"
          operations:
            - name: get-shipments
              method: GET
              description: "Retrieve shipment information for a trading partner"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: tyson-edi-api
      resources:
        - path: /v1/orders
          name: orders
          description: "Purchase orders"
          operations:
            - method: GET
              name: get-orders
              description: "List purchase orders"
              call: "tyson-edi.get-orders"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/shipments
          name: shipments
          description: "Shipment tracking"
          operations:
            - method: GET
              name: get-shipments
              description: "List shipments"
              call: "tyson-edi.get-shipments"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: tyson-edi-mcp
      transport: http
      tools:
        - name: get-orders
          description: "Retrieve purchase orders from the Tyson Foods B2B system"
          hints:
            readOnly: true
            openWorld: true
          call: "tyson-edi.get-orders"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-order-by-id
          description: "Retrieve a specific purchase order from Tyson Foods"
          hints:
            readOnly: true
            openWorld: true
          call: "tyson-edi.get-order-by-id"
          with:
            orderId: "tools.orderId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-shipments
          description: "Retrieve shipment tracking information from Tyson Foods"
          hints:
            readOnly: true
            openWorld: true
          call: "tyson-edi.get-shipments"
          outputParameters:
            - type: object
              mapping: "$."
