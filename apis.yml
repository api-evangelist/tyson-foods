name: Tyson Foods
description: >-
  Tyson Foods is one of the world's largest food companies and a Fortune 100 company, producing chicken, beef, pork, and
  prepared foods. Tyson Foods provides B2B integration capabilities for trading partners including EDI (Electronic Data
  Interchange) and API integrations for supply chain management, order processing, and logistics operations.
