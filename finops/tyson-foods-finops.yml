meters:
  - name: contract_term
    description: Active partner integration contract period
    unit: month
    aggregation: sum
principles:
  - name: Visibility
    description: Reconcile spend from the partner integration contract and any EDI VAN charges; Tyson
      does not expose a public usage telemetry surface.
  - name: Allocation
    description: Allocate to the consuming line of business (retail, food-service, logistics) per the
      contract's scope of work.
  - name: Optimization
    description: Re-scope contract on renewal based on volume of orders, ASNs, and invoices exchanged;
      consolidate trading-partner connections where possible.
  - name: Accountability
    description: Supply-chain and IT integration owners review contract performance and renewal terms
      against actual order volume.
