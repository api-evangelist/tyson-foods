description: 'FOCUS-aligned FinOps for Tyson Foods: B2B-only integration spend, billed under custom partner
  contracts; no public usage-based meters published.'
notes: Tyson Foods has no public API pricing or developer portal. FinOps mapping is best-effort and reflects
  contract-driven B2B integration; meters and FOCUS columns will need to be reconciled against actual
  invoices.
sources:
