description: Tyson Foods does not publish public API rate-limit documentation. Any throttling, quota,
  or SLA terms are defined inside individual B2B integration contracts.
notes: No public rate-limit documentation exists. Limits are governed by partner contract; values cannot
  be reconciled without an active integration agreement.
sources:
  - https://www.tysonfoods.com/
responseCodes:
  throttled: 429
limits:
  - name: Contract-Defined Limit
    scope: contract
    metric: varies
    limit: see partner contract
    notes: Throughput, quota, and burst limits are agreed inside the B2B integration contract; not publicly
      documented.
policies:
  - name: Contractual Governance
    description: Operational limits, retry behavior, and escalation paths are specified in the partner
      integration contract and supporting runbook rather than a public rate-limits page.
